name: Check

on:
  push:
    branches:
      - main
  pull_request: {}

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@v6.5.0
        with:
          node-version: 24
          package-manager-cache: false

      - name: Enable Corepack
        run: |
          corepack enable
          corepack prepare yarn@4.18.0 --activate

      - uses: calcit-lang/setup-calcit@v1.5.0
        with:
          deps-file: deps.cirru
          tools: calcit,caps
          caps-version: 0.1.1

      - name: Verify toolchain
        run: |
          yarn install --immutable
          caps --ci --strict
          caps deps.cirru verify --toolchain

      - name: Run Calcit
        run: |
          calcit calcit.cirru edit format
          git diff --exit-code -- calcit.cirru
          calcit calcit.cirru --check-only
          calcit calcit.cirru analyze check-public --ns app.main --ns app.lib --summary-only
          calcit calcit.cirru

      - name: Compile to JavaScript
        run: |
          calcit calcit.cirru js
          node main.mjs
